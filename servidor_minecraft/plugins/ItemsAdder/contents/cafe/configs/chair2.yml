info:
  namespace: cafe
items:
  chair2:
    display_name: "Silla"
    permission: cafe.chair2
    resource:
      material: PAPER
      generate: false
      model_path: chair2
    behaviours:
      furniture:
        entity: item_display
        fixed_rotation: true 
        display_transformation:
          transform: HEAD
          right_rotation:
            axis_angle:
              angle: 180
              axis:
                x: 0
                y: 1
                z: 0
          translation:
            x: 0
            y: 1.6
            z: 0
          scale:
            x: 0.6
            y: 0.6
            z: 0.6
        solid: true
        placeable_on:
          floor: true
          ceiling: false
          walls: false
        hitbox:
          length: 1
          width: 1
          height: 1
        sound:
          place:
            name: block.metal.fall
          break:
            name: block.metal.break
      furniture_sit:
        sit_height: 1
        passenger_rotate_body: true