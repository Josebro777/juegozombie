### RECOIL ###

VEHICLE_TRUCK_recoil:
  Skills:
  - recoil{r=10;pitch=-.4}
  - delay 1
  - recoil{r=10;pitch=.3}
  - delay 1
  - recoil{r=10;pitch=-.2}
  - delay 1
  - recoil{r=10;pitch=.1}

# just in case a player disconnects, removes the player model #

VEHICLE_TRUCK_hide_player_on_dc:
  Skills:
  - skill{s=VEHICLE_TRUCK_hide_driver_on_dc} @self
  - skill{s=VEHICLE_TRUCK_hide_passenger_on_dc} @self
  - skill{s=VEHICLE_TRUCK_hide_back_on_dc} @self

VEHICLE_TRUCK_hide_driver_on_dc:
  Conditions:
  - modelhasdriver false
  Skills:
  - partvis{p=root_driver;child=true;em=true} @self

VEHICLE_TRUCK_hide_passenger_on_dc:
  Conditions:
  - modelhaspassengers{mid=vehicle_truck;p=passenger_seat} false
  Skills:
  - partvis{p=root_passenger;child=true;em=true} @self

VEHICLE_TRUCK_hide_back_on_dc:
  Conditions:
  - modelhaspassengers{mid=vehicle_truck;p=passenger_back} false
  Skills:
  - partvis{p=root_back;child=true;em=true} @self



