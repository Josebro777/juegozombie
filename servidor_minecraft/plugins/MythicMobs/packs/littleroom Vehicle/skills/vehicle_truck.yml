## EXIT ##

VEHICLE_TRUCK_enter_driver:
  Cooldown: 1
  TriggerConditions:
  - holding{m=VEHICLE_PAINT_*} false
  - fieldofview{angle=90;r=90}
  Conditions:
  - varequals{var=caster.flooded;val=true} false
  - modelhasdriver false
  Skills:
  - setvar{var=caster.alarm_setoff;val=false;type=STRING} @self
  - sudoskill{s=VEHICLE_TRUCK_hide_driver;cat=true} @trigger
  - sound{s=littleroom_vehicle_pack:vehicle.door_shut;v=1;p=<random.float.-0.8to1.1>;sc=HOSTILE;delay=5} @self
  - sound{s=littleroom_vehicle_pack:vehicle.truck_start;v=1;sc=HOSTILE;delay=5} @self
  - setvar{var=caster.engine;val=started;type=STRING;delay=20} @self
  - partvis{p=head_light;v=true} @self
  - partvis{p=root_driver;child=true;v=true;em=true} @self
  - modelplayerskin{p=driver_head} @trigger
  - state{s=enter_driver;p=14} @self
  - mountmodel{mode=[
      - move{front=<skill.var.meg:front>;side=0} ?!variableEquals{var=caster.flooded;val=true}
      - skill{s=VEHICLE_TRUCK_exit_driver} @trigger ?variableInRange{var=skill.meg:sneak;value=>0}
      - setvar{var=caster.honk;val=false;type=STRING} @self ?variableEquals{var=skill.meg:jump;value=0}
      - skill{s=VEHICLE_TRUCK_blinker_left} @self ?variableInRange{var=skill.meg:side;value=>0}
      - skill{s=VEHICLE_TRUCK_blinker_right} @self ?variableInRange{var=skill.meg:side;value=<0}
      - skill{s=VEHICLE_TRUCK_blinker_reset} @self ?variableInRange{var=skill.meg:side;value=-0.1to0.1}
      - skill{s=VEHICLE_TRUCK_honk} @self ?variableEquals{var=skill.meg:jump;value=1}
      - skill{s=VEHICLE_TRUCK_forward_set} @self ?variableInRange{var=skill.meg:front;value=>0}
      - skill{s=VEHICLE_TRUCK_reverse_set} @self ?variableInRange{var=skill.meg:front;value=<0}
      - skill{s=VEHICLE_TRUCK_direction_stop} @self ?variableInRange{var=skill.meg:front;value=0}
    ]} @trigger

VEHICLE_TRUCK_hide_driver:
  Skills:
  - potion{type=DAMAGE_RESISTANCE;l=4;d=10;p=false;i=false} @self
  - potion{type=INVISIBILITY;l=4;d=10;p=false;i=false} @self
  - hide{d=20} @Server

VEHICLE_TRUCK_exit_driver:
  Cooldown: 1
  Conditions:
  - varequals{var=caster.driverexit;val=true} false
  Skills:
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_idle_120_tick;v=1;sc=HOSTILE} @pir{r=4}
  - setvar{var=caster.engine;val=stopped;type=STRING} @self
  - sound{s=littleroom_vehicle_pack:vehicle.door_shut;v=1;p=<random.float.-0.8to1.1>;sc=HOSTILE;delay=5} @self
  - setvar{var=caster.driverexit;val="true";type=STRING;d=10} @self
  - partvis{p=root_driver;child=true;em=true;delay=5} @self
  - skill{s=VEHICLE_TRUCK_direction_stop} @self
  - state{s=exit_driver;p=14} @self
  - sudoskill{s=VEHICLE_TRUCK_show_driver} @trigger
  - skill{s=VEHICLE_TRUCK_exit_lights_time_out;delay=80} @self
  - delay 3
  - dismountmodel @trigger

VEHICLE_TRUCK_show_driver:
  Skills:
  - potionclear{type=INVISIBILITY;repeat=4;repeati=1;delay=3} @self
  - showEntity{delay=3} @Server

VEHICLE_TRUCK_exit_lights_time_out:
  Conditions:
  - modelhasdriver false
  Skills:
  - partvis{p=head_light;v=false} @self
  - partvis{p=brake_light;v=false} @self

## PASSENGER ##

VEHICLE_TRUCK_enter_passenger:
  Cooldown: 1
  Conditions:
  - varequals{var=caster.flooded;val=true} false
  - modelhaspassengers{mid=vehicle_truck;p=passenger_seat} false
  TriggerConditions:
  - holding{m=VEHICLE_PAINT_*} false
  - fieldofview{angle=90;r=270}
  Skills:
  - partvis{p=root_passenger;child=true;v=true;em=true} @self
  - sudoskill{s=VEHICLE_TRUCK_hide_passenger;cat=true} @trigger
  - sound{s=littleroom_vehicle_pack:vehicle.door_shut;v=1;p=<random.float.-0.8to1.1>;sc=HOSTILE;delay=5} @self
  - modelplayerskin{p=passenger_head} @trigger
  - state{s=enter_passenger;p=17} @self
  - mountmodel{d=false;
               mid=vehicle_truck;
               p=passenger_seat;
               mode=[
               - skill{s=VEHICLE_TRUCK_exit_passenger} @trigger ?variableEquals{var=skill.meg:sneak;value=1}
               - skill{s=VEHICLE_TRUCK_passenger_to_driver} @trigger ?variableInRange{var=skill.meg:side;value=>0}
               ]} @trigger

