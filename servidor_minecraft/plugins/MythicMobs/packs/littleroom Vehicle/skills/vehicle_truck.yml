## LANDING ##

VEHICLE_TRUCK_hard_land_velocity_check:
  Conditions:
  - onground false
  - directionalVelocity{y=-0.4to0.3} false
  - varequals{var=caster.hard_land;val=true} false
  Skills:
  - state{s=in_air_tilt_down;li=5;lo=5;p=12} @self
  - setvar{var=caster.hard_land;val=true;type=STRING} @self

VEHICLE_TRUCK_suspension_hard_land:
  Cooldown: 0.1
  Conditions:
  - varequals{var=caster.flooded;val=true} false
  - varequals{var=caster.hard_land;val=true} true
  - ( altitude{a=<1.25} || onground )
  Skills:
  - setvar{var=caster.hard_land;val=false;type=STRING} @self
  - sound{s=littleroom_vehicle_pack:vehicle.vehicle_hard_land;v=1;p=<random.float.-0.8to1.1>;sc=HOSTILE} @self
  - jump{v=0.2} @self
  - state{s=hard_landing_forward;lo=5;p=12} @self

## LOW HEALTH ##

VEHICLE_TRUCK_low_health:
  Skills:
  - e:p{p=large_smoke;hs=.25;vs=.1;a=4;y=1.5} @forward{f=1.5}


## DEATH ##

VEHICLE_TRUCK_death:
  Skills:
  - potion{type=BLINDESS;duration=40;level=4} @modelDriver
  - potion{type=BLINDESS;duration=40;level=4} @modelPassengers
  - potion{type=NAUSEA;duration=240;level=4} @modelDriver
  - potion{type=NAUSEA;duration=240;level=4} @modelPassengers
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_start;v=1;sc=HOSTILE} @modelDriver
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_start;v=1;sc=HOSTILE} @modelPassengers
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_idle_120_tick;v=1;sc=HOSTILE} @modelDriver
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_idle_120_tick;v=1;sc=HOSTILE} @modelPassengers
  - sudoskill{s=VEHICLE_TRUCK_show_passenger} @modelDriver
  - sudoskill{s=VEHICLE_TRUCK_show_driver} @modelPassengers
  - damage{a=5} @modelDriver
  - damage{a=5} @modelPassengers
  - throw{v=6;vy=2} @modelPassengers
  - throw{v=6;vy=2} @modelDriver
  - dismountallmodel @self
  - skill{s=VEHICLE_TRUCK_recoil} @pir{r=16}
  - e:p{p=lava;a=10;hs=.25;vs=.15;y=1} @self
  - e:p{p=flash;a=1;y=1} @self
  - summon{t=VEHICLE_TRUCK_DEAD} @self

