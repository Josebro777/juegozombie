  - partvis{p=backup_light} @self
  - skill{s=VEHICLE_TRUCK_direction_stop_forward} @self
  - skill{s=VEHICLE_TRUCK_direction_stop_reverse} @self
  - setvar{var=caster.direction;val=stop;type=STRING} @self
