VEHICLE_TRUCK_forward_set:
  Conditions:
  - varequals{var=caster.gas;val=0} false
  - varequals{var=caster.flooded;val=true} false
  - varequals{var=caster.direction;val=forward} false
  - varequals{var=caster.driverexit;val=true} false
  Skills:
  - setvar{var=caster.direction;val=forward;type=STRING} @self
  - skill{s=VEHICLE_TRUCK_forward_acceleration} @self
  - partvis{p=brake_light;v=false} @self
  - partvis{p=backup_light} @self
  - e:p{p=block;m=dirt;a=5;repeat=4;repeati=1} @modelpart{pid=back_right_tire;em=false}
  - e:p{p=block;m=dirt;a=5;repeat=4;repeati=1} @modelpart{pid=back_left_tire;em=false}
  - state{s=start_forward;p=11} @self
  - state{s=forward} @self

VEHICLE_TRUCK_acceleration_loop:
  Cooldown: 6
  Conditions:
  - varequals{var=caster.forward_speed;val=full} true
  Skills:
  - sound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_idle_120_tick;v=1;sc=HOSTILE} @self


VEHICLE_TRUCK_idle_loop:
  Cooldown: 3
  Conditions:
  - modelhasdriver true
  - varequals{var=caster.forward_speed;val=full} false
  - varequals{var=caster.engine;val=started} true
  Skills:
  - sound{s=littleroom_vehicle_pack:vehicle.truck_idle_60_tick;v=1;sc=HOSTILE} @self



VEHICLE_TRUCK_forward_acceleration:
  Conditions:
  - variableInRange{var=skill.meg:front;value=>0}
  Skills:
  - sound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_start;v=1;sc=HOSTILE} @self
  - setspeed{t=walking;s=0.25} @self
  - delay 12
  - skill{s=VEHICLE_TRUCK_forward_acceleration_2} @self

VEHICLE_TRUCK_forward_acceleration_2:
  Conditions:
  - variableInRange{var=skill.meg:front;value=>0}
  Skills:
  - setspeed{t=walking;s=0.5} @self
  - delay 12
  - skill{s=VEHICLE_TRUCK_forward_acceleration_3} @self

VEHICLE_TRUCK_forward_acceleration_3:
  Conditions:
  - variableInRange{var=skill.meg:front;value=>0}
  Skills:
  - setspeed{t=walking;s=0.75} @self
  - delay 12
  - skill{s=VEHICLE_TRUCK_forward_acceleration_4} @self

VEHICLE_TRUCK_forward_acceleration_4:
  Conditions:
  - variableInRange{var=skill.meg:front;value=>0}
  Skills:
  - setspeed{t=walking;s=1} @self
  - delay 12
  - skill{s=VEHICLE_TRUCK_forward_acceleration_5} @self

VEHICLE_TRUCK_forward_acceleration_5:
  Conditions:
  - variableInRange{var=skill.meg:front;value=>0}
  Skills:
  - setspeed{t=walking;s=1.25} @self
  - delay 12
  - setvar{var=caster.forward_speed;val=full;type=STRING} @self
  - skill{s=VEHICLE_TRUCK_forward_acceleration_6} @self

VEHICLE_TRUCK_forward_acceleration_6:
  Conditions:
  - variableInRange{var=skill.meg:front;value=>0}
  Skills:
  - setspeed{t=walking;s=1.5} @self

VEHICLE_TRUCK_reverse_set:
  Conditions:
  - varequals{var=caster.gas;val=0} false
  - varequals{var=caster.flooded;val=true} false
  - varequals{var=caster.direction;val=reverse} false
  - varequals{var=caster.driverexit;val=true} false
  Skills:
  - setvar{var=caster.direction;val=reverse;type=STRING} @self
  - partvis{p=brake_light;v=false} @self
  - setspeed{t=walking;s=0.25} @self
  - partvis{p=backup_light;v=true} @self
  - state{s=start_reverse;p=11} @self
  - state{s=reverse;p=1} @self

VEHICLE_TRUCK_direction_stop:
  Conditions:
  - onground true
  - varequals{var=caster.direction;val=stop} false
  Skills:
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_start;v=1;sc=HOSTILE} @modelDriver
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_start;v=1;sc=HOSTILE} @modelPassengers
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_idle_120_tick;v=1;sc=HOSTILE} @modelDriver
  - stopsound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_idle_120_tick;v=1;sc=HOSTILE} @modelPassengers
  - sound{s=littleroom_vehicle_pack:vehicle.truck_accelerate_stop;v=1;sc=HOSTILE} @self
  - setSkillCooldown{skill=VEHICLE_TRUCK_forward_set;seconds=1} @self
  - setSkillCooldown{skill=VEHICLE_TRUCK_reverse_set;seconds=1} @self
  - partvis{p=brake_light;v=true} @self
  - partvis{p=backup_light} @self
  - skill{s=VEHICLE_TRUCK_direction_stop_forward} @self
  - skill{s=VEHICLE_TRUCK_direction_stop_reverse} @self
  - setvar{var=caster.direction;val=stop;type=STRING} @self
  - modstate{s=reverse;sp=0} @self
  - modstate{s=forward;sp=0} @self

VEHICLE_TRUCK_direction_stop_forward:
  Conditions:
  - varequals{var=caster.direction;val=forward} true
  Skills:
  - state{s=stop_forward;p=11} @self

VEHICLE_TRUCK_direction_stop_reverse:
  Conditions:
  - varequals{var=caster.direction;val=reverse} true
  Skills:
  - state{s=stop_reverse;p=11} @self

VEHICLE_TRUCK_forward_fullspeed:
  Conditions:
  - directionalVelocity{z=>0.45;absz=true;relative=true} orElseCast VEHICLE_TRUCK_forward_fullspeed_reset
  Skills:
  - setvar{var=caster.forward_speed;val=full;type=STRING} @self

VEHICLE_TRUCK_forward_fullspeed_reset:
  Conditions:
  - directionalVelocity{z=<0.75;relative=true} true
  Skills:
  - setvar{var=caster.forward_speed;val=false;type=STRING} @self



