VEHICLE_TRUCK_flooded:
  Cooldown: 1
  TargetConditions:
  - blocktype{type=WATER} true
  Conditions:
  - varequals{var=caster.flooded;val=true} false
  Skills:
  - e:p{p=bubble;a=2;hs=.5;vs=.25;;d=true;dir=0,1,0;s=1;repeat=60;repeati=5} @modelpart{pid=chassis}
  - setvar{var=caster.flooded;val=true;type=STRING} @self
  - setvar{var=caster.engine;val=stopped;type=STRING} @self
  - skill{s=VEHICLE_TRUCK_exit_lights_time_out;delay=80} @self

## COLLISION ##

VEHICLE_TRUCK_collision_check:
  Conditions:
  - varequals{var=caster.forward_speed;val=full} true
  Skills:
  - totem{md=2;oH=VEHICLE_TRUCK_collision_totem;drawhitbox=false;hr=1.25;vr=1;hnp=true;yo=1}



  ##VEHICLE COLLISION##

 #targetconditions wasnt working without this russiandoll style skill setup#
VEHICLE_TRUCK_collision_totem:
  Skills:
  - skill{s=VEHICLE_TRUCK_collision_totem_skill}

VEHICLE_TRUCK_collision_totem_skill:
  Cooldown: 1
  TargetConditions:
  - faction{faction=Vehicle} castinstead VEHICLE_TRUCK_forward_collision_vehicle
  Skills:
  - state{s=hard_landing_forward;lo=5;p=12} @self
  - skill{s=VEHICLE_TRUCK_forward_acceleration_3} @self
  - skill{s=VEHICLE_TRUCK_recoil} @ModelDriver
  - skill{s=VEHICLE_TRUCK_recoil} @ModelPassengers
  - throw{v=8;vy=1}
  - damage{a=5}

VEHICLE_TRUCK_forward_collision_vehicle:
  Cooldown: 1
  Skills:
  - sound{s=littleroom_vehicle_pack:vehicle.vehicle_impact;v=3;p=<random.float.0.9to1.1>;sc=HOSTILE} @self
  - damage{a=5}
  - lunge{v=1.5;vy=0.15} @forward{f=-2}
  - damage{a=1} @ModelDriver
  - damage{a=1} @ModelPassengers
  - skill{s=VEHICLE_TRUCK_recoil} @ModelDriver
  - skill{s=VEHICLE_TRUCK_recoil} @ModelPassengers
  - signal{s=COLLISION}
  - throw{v=5;vy=2}
  - setspeed{t=walking;s=0} @self
  - setSkillCooldown{skill=VEHICLE_TRUCK_forward_set;seconds=1} @self
  - setSkillCooldown{skill=VEHICLE_TRUCK_reverse_set;seconds=1} @self
  - state{s=collision;p=20} @self
  - partvis{p=backup_light} @self
  - skill{s=VEHICLE_TRUCK_direction_stop_forward} @self
  - skill{s=VEHICLE_TRUCK_direction_stop_reverse} @self
  - setvar{var=caster.direction;val=stop;type=STRING} @self
  - modstate{s=reverse;sp=0} @self
  - modstate{s=forward;sp=0} @self


